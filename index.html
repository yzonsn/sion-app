<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sion: Ultimate Master V14</title>
    <style>
        :root { --bg: #f5f2e9; --paper: #fdfaf0; --accent: #5d54a4; --text: #4a453c; --border: #d3cbb8; }
        body { font-family: "Sawarabi Mincho", serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; line-height: 1.5; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: var(--paper); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 3px 3px 10px rgba(0,0,0,0.05); }
        select, input, textarea, button { width: 100%; padding: 10px; margin-top: 8px; border-radius: 8px; border: 1px solid var(--border); font-family: inherit; box-sizing: border-box; }
        button { background: var(--accent); color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        
        .sion-area { display: flex; align-items: flex-start; background: #fff; border: 2px double var(--accent); border-radius: 20px; padding: 15px; }
        #charIcon { font-size: 2.5rem; margin-right: 15px; }
        #supportMsg { font-size: 0.85rem; margin: 0; font-style: italic; color: #555; }

        /* タイマー操作 */
        .timer-ctrl { display: flex; gap: 5px; margin-top: 10px; }
        .timer-ctrl button { font-size: 0.7rem; padding: 5px; }
        #timeLeft { font-size: 2.5rem; font-weight: bold; font-family: monospace; color: var(--accent); margin: 10px 0; }

        /* 執筆欄 */
        textarea#memoInput { background: #fff; border: 1px dashed var(--accent); height: 200px; line-height: 1.8; }
        .count-badge { background: var(--accent); color: white; padding: 2px 10px; border-radius: 12px; font-size: 0.8rem; float: right; }

        /* タスク */
        .task-item { padding: 10px 0; border-bottom: 1px dotted var(--border); font-size: 0.85rem; }
        .task-main { display: flex; justify-content: space-between; align-items: center; }
        .task-info { font-size: 0.7rem; color: #888; margin-top: 4px; }
        .tag { font-size: 0.6rem; padding: 1px 5px; border-radius: 4px; color: white; font-weight: bold; margin-right: 5px; }
        .deadline-alert { color: #c0392b; font-weight: bold; }

        .tag-scenario { background: #a67c52; } .tag-illust { background: #8e9775; } 
        .tag-system { background: #6d8299; } .tag-other { background: #999999; }
        
        .notif-btn { background: #fff; color: var(--accent); border: 1px solid var(--accent); font-size: 0.7rem; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <button class="notif-btn" id="askNotif" onclick="requestNotification()">🔔 支配者の呼び声（通知）を許可</button>

    <div class="card">
        <h2 style="font-size: 0.8rem; margin: 0;">📖 物語の選択</h2>
        <select id="gameSelect" onchange="changeGame()"></select>
    </div>

    <div class="card sion-area">
        <div id="charIcon">👓</div>
        <div>
            <span id="charName" style="font-weight: bold; color: var(--accent);">シオン</span>
            <p id="supportMsg">「……準備はいい？ 君の時間は、僕が預かっているよ。」</p>
        </div>
    </div>

    <div class="card" style="text-align: center;">
        <h2 style="font-size: 0.8rem; margin: 0; text-align: left;">⏳ 時間の管理（タイマー/カウントアップ）</h2>
        <div id="timeLeft">25:00</div>
        <div class="timer-ctrl">
            <button onclick="setTimer(15)">15分</button>
            <button onclick="setTimer(25)">25分</button>
            <button onclick="setTimer(60)">60分</button>
            <button onclick="setMode('up')" style="background:#555;">集中（計上）</button>
        </div>
        <button id="startBtn" onclick="toggleTimer()" style="width: 100%; margin-top: 15px; font-size: 1.1rem;">開始</button>
    </div>

    <div class="card">
        <h2 style="font-size: 0.9rem; margin: 0;">✍️ 本文執筆 <span id="charCount" class="count-badge">0 文字</span></h2>
        <textarea id="memoInput" placeholder="……ここに君の全てを書き留めて。" oninput="handleInput()"></textarea>
    </div>

    <div class="card">
        <h2 style="font-size: 0.9rem; margin: 0;">📋 締切管理</h2>
        <div id="taskList"></div>
        <div style="margin-top:15px; border-top: 1px solid #eee; padding-top: 10px;">
            <input type="text" id="taskInput" placeholder="何をするつもり……？">
            <div style="display: flex; gap: 5px;">
                <input type="date" id="deadlineInput" style="flex: 1;">
                <select id="categorySelect" style="flex: 1;">
                    <option value="scenario">📜 シナリオ</option>
                    <option value="illust">🎨 イラスト</option>
                    <option value="system">⚙️ システム</option>
                    <option value="other">🖋️ その他</option>
                </select>
            </div>
            <button onclick="addTask()">タスクを縛り付ける（保存）</button>
        </div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('sion_v14_db') || '{"物語の種": {"tasks": [], "memo": "", "stats": {}}}');
    let currentId = localStorage.getItem('current_id_v14') || Object.keys(db)[0];
    let timerInterval = null;
    let timerSeconds = 25 * 60;
    let timerMode = 'down'; // 'down' or 'up'

    const sionQuotes = {
        timerStart: ["……よし。この時間は僕だけのものだよ。", "逃げ出さないように、しっかり見てるからね。"],
        timeUp: ["時間だよ。よく頑張ったね、ご褒美……いる？", "ほら、現実に戻る時間だよ。僕が呼びに来た。"],
        deadline: ["……ねぇ、今日が締切のタスクがあるよ。忘れてないよね？", "今日中に終わらせて。……約束だよ？"]
    };

    function requestNotification() {
        Notification.requestPermission().then(p => { if(p==="granted") document.getElementById('askNotif').style.display='none'; });
    }

    function sendNotif(title, body) {
        if (Notification.permission === "granted") new Notification(title, { body: body });
    }

    function setTimer(min) {
        timerMode = 'down';
        timerSeconds = min * 60;
        updateTimerDisplay();
    }

    function setMode(mode) {
        timerMode = mode;
        timerSeconds = 0;
        updateTimerDisplay();
    }

    function updateTimerDisplay() {
        const m = Math.floor(Math.abs(timerSeconds) / 60);
        const s = Math.abs(timerSeconds) % 60;
        document.getElementById('timeLeft').textContent = `${m}:${s.toString().padStart(2, '0')}`;
    }

    function toggleTimer() {
        if (timerInterval) {
            clearInterval(timerInterval); timerInterval = null;
            document.getElementById('startBtn').textContent = "再開";
        } else {
            document.getElementById('startBtn').textContent = "停止";
            const q = sionQuotes.timerStart[Math.floor(Math.random()*2)];
            document.getElementById('supportMsg').textContent = `「${q}」`;
            timerInterval = setInterval(() => {
                timerMode === 'down' ? timerSeconds-- : timerSeconds++;
                updateTimerDisplay();
                if (timerMode === 'down' && timerSeconds <= 0) {
                    clearInterval(timerInterval); timerInterval = null;
                    const msg = sionQuotes.timeUp[Math.floor(Math.random()*2)];
                    sendNotif("シオン", msg);
                    alert("シオン： " + msg);
                    document.getElementById('startBtn').textContent = "開始";
                }
            }, 1000);
        }
    }

    function addTask() {
        const input = document.getElementById('taskInput');
        const deadline = document.getElementById('deadlineInput').value;
        if (!input.value) return;
        db[currentId].tasks.push({ id: Date.now(), title: input.value, category: document.getElementById('categorySelect').value, deadline: deadline, done: false });
        input.value = ''; document.getElementById('deadlineInput').value = '';
        save(); renderTasks();
    }

    function renderTasks() {
        const tasks = db[currentId].tasks || [];
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('taskList').innerHTML = tasks.slice().reverse().map(t => {
            const isOver = t.deadline && t.deadline < today && !t.done;
            const isToday = t.deadline === today && !t.done;
            return `
                <div class="task-item">
                    <div class="task-main" onclick="toggleTask(${t.id})">
                        <span style="${t.done ? 'text-decoration:line-through;color:gray;' : ''}">
                            <span class="tag tag-${t.category}">${t.category.toUpperCase()}</span>${t.title}
                        </span>
                        <span onclick="deleteTask(${t.id}, event)" style="color:#ccc;">×</span>
                    </div>
                    ${t.deadline ? `<div class="task-info ${isToday ? 'deadline-alert' : ''}">⏳ 締切: ${t.deadline} ${isToday ? ' (今日だよ！)' : ''}</div>` : ''}
                </div>
            `;
        }).join('');
    }

    function checkDeadlines() {
        const today = new Date().toISOString().split('T')[0];
        const todayTasks = db[currentId].tasks.filter(t => t.deadline === today && !t.done);
        if (todayTasks.length > 0) {
            const msg = sionQuotes.deadline[Math.floor(Math.random()*2)];
            document.getElementById('supportMsg').textContent = `「${msg}」`;
            sendNotif("シオン", "今日が締切のタスクが " + todayTasks.length + " 件あるよ。");
        }
    }

    function toggleTask(id) {
        db[currentId].tasks = db[currentId].tasks.map(t => (t.id === id ? {...t, done: !t.done} : t));
        save(); renderTasks();
    }

    function deleteTask(id, e) {
        e.stopPropagation();
        db[currentId].tasks = db[currentId].tasks.filter(t => t.id !== id);
        save(); renderTasks();
    }

    function handleInput() {
        const text = document.getElementById('memoInput').value;
        db[currentId].memo = text;
        document.getElementById('charCount').textContent = text.length + " 文字";
        save();
    }

    function save() {
        localStorage.setItem('sion_v14_db', JSON.stringify(db));
        localStorage.setItem('current_id_v14', currentId);
    }

    function changeGame() {
        currentId = document.getElementById('gameSelect').value;
        document.getElementById('memoInput').value = db[currentId].memo || "";
        renderTasks(); save();
    }

    function updateSelect() {
        document.getElementById('gameSelect').innerHTML = Object.keys(db).map(name => `<option value="${name}" ${name === currentId ? 'selected' : ''}>${name}</option>`).join('');
    }

    if (Notification.permission === "granted") document.getElementById('askNotif').style.display='none';
    updateSelect(); renderTasks(); checkDeadlines();
</script>
</body>
</html>
