<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sion</title>
    <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Mincho&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
    .cal-day.today { 
    background: #fff5e6; /* 薄いオレンジ */
    border: 2px solid var(--accent); /* キャラの色で強調 */
    font-weight: bold;
}

        :root {
            --bg: #f5f2e9; --paper: #fdfaf0; --accent: #5d54a4; --text: #4a453c; --border: #d3cbb8; --glow: rgba(93, 84, 164, 0.2);
        }
        body { font-family: 'Sawarabi Mincho', serif; background-color: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        body.watching { box-shadow: inset 0 0 40px var(--glow); }
        header { display: flex; align-items: center; padding: 0 15px; background: var(--paper); border-bottom: 1px solid var(--border); height: 40px; flex-shrink: 0; }
/* これを今の #sion-status と入れ替えてね */
#sion-status { 
    flex: 1; 
    font-size: 0.75rem; 
    color: var(--accent); 
    font-weight: bold; 
    /* ↓ここがポイント！ */
    white-space: normal;      /* 1行で切らずに折り返す設定にするよ */
    overflow: visible;        /* はみ出しても隠さない */
    text-overflow: clip;      /* 三点リーダー（…）で省略しない */
    line-height: 1.3;         /* 行間を少し広げて読みやすく */
    display: flex;            /* 真ん中に寄せるための準備 */
    align-items: center; 
    padding: 5px 0;           /* 上下に少し隙間を作る */
}

/* ヘッダー自体の高さも、セリフに合わせて伸びるように変更 */
header { 
    display: flex; 
    align-items: center; 
    padding: 5px 15px;        /* paddingを上下5pxに */
    background: var(--paper); 
    border-bottom: 1px solid var(--border); 
    height: auto;             /* 固定の40pxから「中身に合わせる」に変更 */
    min-height: 40px;         /* 最低でも40pxは確保 */
    flex-shrink: 0; 
}

        main { flex: 1; overflow-y: auto; position: relative; }
        .tab-content { display: none; padding: 12px; padding-bottom: 100px; min-height: 100%; box-sizing: border-box; }
        .tab-content.active { display: flex; flex-direction: column; gap: 10px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: var(--paper); border: 1px solid var(--border); border-radius: 16px; padding: 12px; box-shadow: 2px 2px 8px rgba(0,0,0,0.05); display: flex; flex-direction: column; margin-bottom: 10px; }
        .list-area { max-height: 250px; overflow-y: auto; margin: 10px 0; }
        .item-container { display: flex; align-items: center; background: white; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; position: relative; }
        .item-main { flex: 1; padding: 10px; font-size: 0.85rem; cursor: pointer; padding-right: 40px; }
        .item-main.completed { text-decoration: line-through; opacity: 0.6; }
        .item-edit-btn { position: absolute; right: 10px; color: #ccc; cursor: pointer; padding: 5px; }
        .task-meta { font-size: 0.65rem; color: #8e7c52; display: block; margin-top: 4px; }

        .chart-container { position: relative; height: 120px; width: 120px; margin: 0 auto; }

        /* カレンダー用スタイル */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: var(--border); border: 1px solid var(--border); }
        .cal-header { background: #eee; text-align: center; font-size: 0.6rem; padding: 5px 0; }
        .cal-day { background: var(--paper); min-height: 50px; padding: 4px; font-size: 0.7rem; position: relative; cursor: pointer; }
        .cal-day.today { background: #eef; font-weight: bold; outline: 1px solid var(--accent); }
        .cal-day.has-task::after { content: '●'; color: var(--accent); position: absolute; bottom: 2px; right: 2px; font-size: 8px; }
        .log-badge { display: block; font-size: 0.5rem; color: var(--accent); margin-top: 2px; font-weight: normal; }

        .timer-unit { display: flex; justify-content: space-around; align-items: center; background: rgba(93, 84, 164, 0.05); border-radius: 16px; padding: 10px; border: 1px solid var(--border); }
        .hourglass { width: 25px; height: 38px; position: relative; border: 2px solid var(--accent); clip-path: polygon(0% 0%, 100% 0%, 60% 50%, 100% 100%, 0% 100%, 40% 50%); }
        .sand-top, .sand-bottom { position: absolute; left: 0; width: 100%; height: 50%; background: var(--accent); }
        .sand-top { top: 0; transform-origin: bottom; } .sand-bottom { bottom: 0; transform: scaleY(0); transform-origin: bottom; }
        textarea#editor { width: 100%; height: 35vh; background: transparent; border: none; outline: none; font-family: inherit; font-size: 1.05rem; line-height: 1.8; resize: none; color: var(--text); padding: 10px; box-sizing: border-box; }
        .symbol-bar { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
        .sym-btn { background: var(--paper); color: var(--accent); border: 1px solid var(--accent); padding: 5px 12px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; flex-shrink: 0; }

        nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: var(--paper); display: flex; justify-content: space-around; align-items: center; border-top: 2px solid var(--accent); z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: #b0aaa0; text-align: center; font-size: 0.6rem; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
        .nav-item i { font-size: 1.3rem; display: block; margin-bottom: 4px; }
        .btn { background: var(--accent); color: white; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.75rem; box-shadow: 0 3px 0 #3f3972; }
        input, select, textarea { background: #fff; border: 1px solid var(--border); padding: 8px; border-radius: 8px; width: 100%; box-sizing: border-box; font-family: inherit; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 5000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .modal-card { background: var(--paper); border-radius: 20px; padding: 20px; width: 85%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    </style>
</head>
<body id="body">

<header><div id="sion-status">「君の物語と歩む、大切な暦と任務を預かるよ。」</div></header>

<main>

    </div>

    <div id="tab-write" class="tab-content active">

            </div>
        </div>

        <div class="card" style="margin-bottom: 5px;">
            <textarea id="editor" placeholder="……物語を紡いで。" oninput="updateContent()"></textarea>
        </div>

        <div id="dynamic-symbol-bar" class="symbol-bar" style="padding: 10px 5px; background: var(--paper); border-radius: 10px; border: 1px solid var(--border); margin-bottom: 10px;"></div>

        <div class="card">
            <div style="display:flex; justify-content:center; gap:8px; margin-bottom:10px;">
                <input type="number" id="set-min" value="25" style="width:60px; text-align:center;"> 分
                <input type="number" id="set-sec" value="0" style="width:60px; text-align:center;"> 秒

            </div>
        </div>
    </div>

    <div id="tab-task" class="tab-content">
        <div class="card" style="flex-direction:row; align-items:center; justify-content:space-between;">
            <div>
                <h3 id="task-project-name" style="font-size:0.9rem; margin:0; color:var(--accent);">作品名</h3>
                <p style="font-size:0.6rem; margin:4px 0 0 0;">の任務進捗</p>
            </div>
            <div class="chart-container"><canvas id="taskChart"></canvas></div>
        </div>
        <div class="card">
            <select id="task-filter" style="width:auto; font-size:0.7rem; margin-bottom:10px;" onchange="renderTasks()">

                <option value="イラスト">イラスト</option>

        </div>
    </div>

    <div id="tab-calendar" class="tab-content">

<div class="card">

</div>

    </div>

</main>

<script>
  let lastSavedContent = ""; // 最後に保存した内容を覚えておく変数

async function saveToCloud() {
    const syncId = document.getElementById('sync-id').value;
    const currentContent = document.getElementById('editor').value; // 今、エディタにある文字

    // 【ここがポイント！】
    // もし今の中身が、最後に保存した時と「全く同じ」なら、何もしないで帰る
    if (!syncId || currentContent === lastSavedContent) {
        return; 
    }

    const data = { library, tasks, dailyLogs, partner: currentPartner };

    try {
        await fetch(`https://kvdb.io/6E9X6S4PjH7q5P8Q8E9X6S/${syncId}`, {
            method: 'POST',
            body: JSON.stringify(data)
        });
        
        // 保存に成功したら、「これが最新だよ」と覚えさせる
        lastSavedContent = currentContent; 
        console.log("中身が変わっていたので自動同期したよ！");
    } catch (e) {
        console.error("同期失敗...", e);
    }
}

        // --- 差分計算の魔法 ---
        if (window.lastCharCount === undefined) window.lastCharCount = charCount;
        const diff = charCount - window.lastCharCount;

        if (diff > 0) {
            dailyLogs[todayStr] = (dailyLogs[todayStr] || 0) + diff;
        }

    function renderTasks() {
        const list = document.getElementById('taskList'), filter = document.getElementById('task-filter').value;
        const currentTitle = library[currentProjIdx].title;
        document.getElementById('task-project-name').textContent = currentTitle;
        let filtered = tasks.filter(t => t.project === currentTitle && (filter === 'すべて' || t.category === filter));
        filtered.sort((a, b) => a.done - b.done);
        list.innerHTML = filtered.map(t => {
            const idx = tasks.indexOf(t);
            return `<div class="item-container">
                <div class="item-main ${t.done?'completed':''}" onclick="toggleTask(${idx})">
                    <strong>[${t.category}] ${t.title}</strong>
                    <span class="task-meta">${t.deadline ? '⌛'+t.deadline : ''} ${t.memo ? '📝'+t.memo : ''}</span>

            </div>`;
        }).join('');

    }
    function renderCategoryBars(projectTitle) {
        const cats = ['シナリオ', 'イラスト', 'システム', 'その他'], colors = {'シナリオ':'#5d54a4','イラスト':'#e67e22','システム':'#27ae60','その他':'#95a5a6'};
        const pTasks = tasks.filter(t => t.project === projectTitle);
        document.getElementById('category-bars').innerHTML = cats.map(cat => {
            const cTasks = pTasks.filter(t => t.category === cat);
            if (cTasks.length === 0) return '';
            const percent = Math.round((cTasks.filter(t => t.done).length / cTasks.length) * 100);
            return `<div style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;font-size:0.65rem;margin-bottom:2px;"><span>${cat}</span><span>${percent}%</span></div>
            <div style="background:#ddd;height:6px;border-radius:3px;overflow:hidden;"><div style="background:${colors[cat]};width:${percent}%;height:100%;transition:width 0.3s;"></div></div></div>`;
        }).join('');
    }
    function updateChart(projectTitle) {
        const pTasks = tasks.filter(t => t.project === projectTitle);
        const cats = ['シナリオ', 'イラスト', 'システム', 'その他'], colors = ['#5d54a4', '#e67e22', '#27ae60', '#95a5a6'];
        const dataValues = cats.map(c => pTasks.filter(t => t.category === c && t.done).length);
        const unDone = pTasks.length - dataValues.reduce((a,b)=>a+b, 0);
        if(taskChart) taskChart.destroy();
        taskChart = new Chart(document.getElementById('taskChart').getContext('2d'), {
            type: 'doughnut', data: { labels: [...cats, '未完了'], datasets: [{ data: [...dataValues, Math.max(0, unDone)], backgroundColor: [...colors, '#d3cbb8'], borderWidth: 0 }] },
            options: { cutout: '70%', plugins: { legend: { display: false } } }
        });
    }

    const date = deadline.replace(/-/g, "");
    const url = `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent("任務締切：" + taskTitle)}&dates=${date}/${date}&details=執筆アプリからの自動登録です。頑張りましょう！&sf=true&output=xml`;
    
    // 別ウィンドウでカレンダー作成画面を開く
    window.open(url, '_blank');
}

    function toggleTimer(m) {
        if (isRunning) { clearInterval(timer); isRunning = false; document.getElementById('body').classList.remove('watching'); return; }
        isRunning = true; document.getElementById('body').classList.add('watching');
        timer = setInterval(() => { m === 'down' ? currentSec-- : currentSec++; if (currentSec <= 0 && m === 'down') { clearInterval(timer); isRunning = false; playAlarm(); alert("時間だよ。"); } updateTimerDisplay(m); }, 1000);

    function resetTimer() { clearInterval(timer); isRunning = false; currentSec = (parseInt(document.getElementById('set-min').value)||0)*60 + (parseInt(document.getElementById('set-sec').value)||0); totalSec = currentSec; updateTimerDisplay('down'); }
    function updateTimerDisplay(m) {
        const abs = Math.abs(currentSec), mm = Math.floor(abs/60), ss = abs%60;
        document.getElementById('timer-display').textContent = `${mm.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`;
        const ratio = totalSec > 0 ? currentSec / totalSec : 0;
        document.getElementById('sand-t').style.transform = `scaleY(${m==='down'?ratio:1})`;
        document.getElementById('sand-b').style.transform = `scaleY(${m==='down'?1-ratio:1})`;
    }
    function playAlarm() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const pb = (t) => { const o = ctx.createOscillator(); const g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.type = 'square'; o.frequency.setValueAtTime(880, t); g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.1); o.start(t); o.stop(t + 0.1); };
        [0, 0.2, 0.4].forEach(t => pb(ctx.currentTime + t));
    }

    function updateSionStatus(type = 'default') {

// データをクラウドに送る関数
async function saveToCloud() {
    const syncId = document.getElementById('sync-id').value;
    if (!syncId) { alert("合言葉を入力してね！"); return; }
    
    const status = document.getElementById('sync-status');
    status.textContent = "同期中...";

    // 保存するデータのカタマリを作る
    const data = {
        library: library,
        tasks: tasks,
        dailyLogs: dailyLogs,
        partner: currentPartner
    };

    try {
        // kvdb.io という倉庫にデータを預ける（URLの最後が合言葉になるよ）
        await fetch(`https://kvdb.io/6E9X6S4PjH7q5P8Q8E9X6S/${syncId}`, {
            method: 'POST',
            body: JSON.stringify(data)
        });
        status.textContent = "クラウドに保存したよ！";
    } catch (e) {
        status.textContent = "エラーが発生しました。";
        console.error(e);
    }
}

// クラウドからデータを取ってくる関数
async function loadFromCloud() {
    const syncId = document.getElementById('sync-id').value;
    if (!syncId) { alert("合言葉を入力してね！"); return; }

    const status = document.getElementById('sync-status');
    status.textContent = "読込中...";

    try {
        const res = await fetch(`https://kvdb.io/6E9X6S4PjH7q5P8Q8E9X6S/${syncId}`);
        if (!res.ok) throw new Error();
        
        const data = await res.json();
        
        // 届いたデータを今のアプリに上書きする
        library = data.library;
        tasks = data.tasks;
        dailyLogs = data.dailyLogs;
        currentPartner = data.partner || 'sion';

        // ブラウザの保存領域にも覚えさせて、画面を更新！
        saveAll();
        alert("同期が完了しました！ページを再読み込みします。");
        location.reload(); 
    } catch (e) {
        status.textContent = "データが見つかりません。合言葉が合っているか確認してね。";
    }
}

function checkDeadlines() {
    const todayStr = new Date().toISOString().split('T')[0];
    const todaysTasks = tasks.filter(t => t.deadline === todayStr && !t.completed);

    if (todaysTasks.length > 0 && Notification.permission === 'granted') {

            });
        });
    }
